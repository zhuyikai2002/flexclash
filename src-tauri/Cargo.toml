[package]
name = "flexclash"
version = "0.6.1"
description = "FlexClash - lightweight Mihomo (Clash Meta) proxy client"
authors = ["FlexClash Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flexclash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

# Regenerates `src/bindings.ts` without launching the GUI.
#
# `required-features` keeps it out of ordinary `cargo build` / `tauri build`
# runs. That matters: the binary links the whole command graph (and therefore
# the WebView2 / windows crate stack), so building it unconditionally would
# add a second full binary -- and under `lto = true` + `codegen-units = 1` a
# slow one -- to every release. CI enables the feature explicitly so the file
# is still linted.
#
# A `[[bin]]` target is also the only place this may live. `tauri-build` links
# its comctl32 v6 manifest with `cargo:rustc-link-arg-bins`, which covers every
# bin target but *not* test targets; generating from a `#[cfg(test)]` helper
# instead produces a test executable that fails to load with
# STATUS_ENTRYPOINT_NOT_FOUND.
[[bin]]
name = "export-bindings"
path = "src/bin/export-bindings.rs"
required-features = ["export-bindings"]

# Head-less harness that drives one real geo-data refresh cycle against a live
# kernel (`src/bin/geodata-smoke.rs`). It has to be a `[[bin]]` for the same
# reason `export-bindings` does, and it is feature-gated for the same reason:
# a release build must not carry a second binary through `lto`.
[[bin]]
name = "geodata-smoke"
path = "src/bin/geodata-smoke.rs"
required-features = ["geodata-smoke"]

[features]
# Opt-in marker for the `export-bindings` binary above. Enables no code by
# itself -- it exists purely to gate that one target.
export-bindings = []
# Opt-in marker for the `geodata-smoke` harness. Also enables the one
# `run_refresh` re-export in `lib.rs` that the harness calls.
geodata-smoke = []

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell    = "2"
tauri-plugin-fs       = "2"
tauri-plugin-http     = "2"
tauri-plugin-process  = "2"
tauri-plugin-dialog   = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
# One instance only: two copies fight over the reserved inbound port (7897)
# and over ownership of the system proxy.
tauri-plugin-single-instance = "2"
window-vibrancy       = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
# `net` + `io-util` are here for the kernel WebSocket ingest
# (`core/ingest.rs`): `tokio-tungstenite` dials a TCP socket and drives the
# handshake through `tokio::io`.
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "sync", "net", "io-util"] }
# `StreamExt::buffer_unordered` — the bounded fan-out used by the native
# speed-test engine (`core/speedtest.rs`). That trait is *defined* in
# `futures-util`, which is the crate pulling it in directly avoids the
# umbrella `futures` crate and its extra `futures-executor` weight.
# `sink` adds `SinkExt`, which the ingest needs to answer WebSocket pings.
futures-util = { version = "0.3", default-features = false, features = ["std", "sink"] }
# Kernel data-plane WebSocket client (Mihomo's `/traffic` and `/logs`).
# `default-features = false` with only `connect` + `handshake` deliberately
# keeps TLS out: the controller is a plain `ws://` loopback address, so a
# second TLS stack (rustls here, on top of the one reqwest already links)
# would be pure dead weight.
tokio-tungstenite = { version = "0.26", default-features = false, features = ["connect", "handshake"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
# SHA-256 for the geo-data transfer half (`core/geodata`). The change detector
# is a content digest, not an HTTP validator: the primary source is a GitHub
# release asset whose 302 carries no ETag at all, and jsDelivr's ETag is issued
# per edge node rather than derived from the bytes (measured -- see the module
# docs). A content digest cannot drift that way. `sha2` is pure Rust with no
# build script, so it costs nothing at link time beyond itself.
sha2 = "0.10"
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
# `derive` pulls in `tauri-specta-macros` for the `#[derive(Event)]` macro that
# turns the kernel data-plane payloads (`core/kernel_events.rs`, plus
# `ConfigRefreshPayload`) into registry-checked typed events.
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript", "derive"] }
# `chrono` supplies the `specta::Type` impls for `DateTime<Utc>`, which
# `HistoryPoint.ts` and friends carry. Without it the IPC types cannot derive
# `Type` at all.
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json", "chrono"] }
specta-typescript = "0.0.12"
tauri-plugin-updater = "2.0.0-rc.4"

[dev-dependencies]
serial_test = "3"

# Windows-only: registry + WinINET refresh
[target."cfg(windows)".dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
# WebView2 底层控制：彻底禁用 DevTools + 浏览器加速键（Ctrl+Shift+I / F12 / Ctrl+R 等）
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
