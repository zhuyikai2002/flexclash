<!DOCTYPE html>
<html lang="en" class="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>FlexClash</title>
    <script>
      // The app is dark-only (light variant was removed — see
      // `src/stores/theme.ts`). We still set the class + color-scheme
      // synchronously so the first paint is on-brand; this also
      // pins native form controls (scrollbars, inputs) to dark.
      (function () {
        document.documentElement.classList.add('dark');
        document.documentElement.style.colorScheme = 'dark';
      })();
    </script>
  </head>
  <body class="select-none">
    <div id="app"></div>
    <script type="module" src="/src/main.ts"></script>
    <script>
      // Block the WebView's default context menu (right-click), drag
      // start, and text selection.  This kills the "I'm a website"
      // feel of the desktop app.  Components that need to expose
      // selectable text (e.g. the controller port, a copy-able
      // subscription URL) opt in via the `.selectable` class on a
      // child element — see `style.css`.
      (function () {
        document.addEventListener('contextmenu', (e) => e.preventDefault());
        document.addEventListener('dragstart', (e) => e.preventDefault());
        document.addEventListener('selectstart', (e) => {
          // Only allow if the user explicitly clicked inside a
          // `.selectable` (or input/textarea/contenteditable) element.
          const t = e.target;
          if (t && t.closest && t.closest('.selectable, input, textarea, [contenteditable="true"]')) {
            return;
          }
          e.preventDefault();
        });
      })();
    </script>
  </body>
</html>
