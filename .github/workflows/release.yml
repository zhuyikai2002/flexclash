# ============================================================================
# release.yml — tag-driven multi-platform build + GitHub Release.
#
# Trigger: pushing a tag matching `v*` (e.g. `v0.6.3`). Nothing else starts this
# workflow -- no branch pushes, no pull requests.
#
# Matrix:
#   ubuntu-22.04   → x86_64-unknown-linux-gnu   .deb / .rpm / .AppImage
#   windows-latest → x86_64-pc-windows-msvc      NSIS installer / MSI
#
# `tauri-apps/tauri-action@v0` runs the build, creates the Release for the tag,
# and uploads every bundle it produced (plus the updater manifest). The Release
# is a real (non-draft, non-prerelease) release: the in-app updater polls
# `releases/latest/download/latest.json`, and GitHub's `/latest/` excludes both
# drafts and prereleases.
#
# THE CHANGELOG IS ASSEMBLED FROM release_notes.md IN THREE PLACES, because the
# action only accepts a plain string and silently ignores unknown inputs:
#
#   1. Release page body   -> "Publish notes" step output -> `releaseBody`.
#   2. In-app dialog       -> `latest.json > notes`, which tauri-action leaves
#                             EMPTY; the "Patch updater manifest notes" step
#                             rewrites the uploaded asset with the same file.
#   3. (local builds)      -> `scripts/gen-latest-json.py`.
#
# Any new place that shows a changelog MUST read `release_notes.md`, never a
# hand-copied constant. v0.6.4 shipped with (1) and (2) both blank because the
# action was given a `bodyPath` key it does not have.
#
# IMPORTANT: the tag and `tauri.conf.json > version` must agree. `latest.json`
# points at `releases/download/v<version>/...`, where `<version>` is read from
# tauri.conf.json -- not from the tag. Tag `v0.6.3` while the config still says
# `0.6.2` and the manifest publishes a URL that 404s. Bump the version (both
# `tauri.conf.json` and `package.json`) before tagging.
#
# The mihomo sidecar is `.gitignore`d and resolved by tauri-build's build script,
# so it MUST be fetched on every run. The pinned version + digest live in
# `.github/actions/fetch-mihomo/`, shared with `ci.yml`.
# ============================================================================

name: Release

on:
  push:
    tags:
      - 'v*'

# The tauri-action step creates a Release and uploads assets with the automatic
# token. Everything else only reads, so this is the whole permission set.
permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.platform }})
    runs-on: ${{ matrix.platform }}
    # `TAURI_SIGNING_PRIVATE_KEY_PASSWORD` is set to an empty string below so
    # tauri never falls back to an interactive prompt; should that regress, the
    # run hangs rather than fails. This cap is the backstop.
    timeout-minutes: 90

    strategy:
      # One platform failing must not cancel the other: a Linux-only packaging
      # regression should still let the Windows installer publish, and vice
      # versa.
      fail-fast: false
      matrix:
        include:
          - platform: ubuntu-22.04
            target: x86_64-unknown-linux-gnu
            sidecar: linux
          - platform: windows-latest
            target: x86_64-pc-windows-msvc
            sidecar: windows

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Tauri's Linux build needs the WebKitGTK/AppIndicator/RSVG dev headers,
      # `patchelf` (AppImage bundling) and OpenSSL. `libappindicator3-dev` is the
      # Ubuntu 22.04 name; Arch's runtime counterpart is `libappindicator-gtk3`
      # (see packaging/arch/PKGBUILD).
      - name: Install Linux dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          # package-lock.json is committed, so the npm download cache is keyed
          # on it and survives between releases. NOTE: this only configures the
          # cache -- it installs nothing. See the step below.
          cache: npm

      # `package-lock.json` is the committed source of truth, so `npm ci` (not
      # `npm install`) is the reproducible install. `tauri` itself is a
      # devDependency resolved from `node_modules/.bin/tauri`, and the frontend
      # compile runs inside `tauri build` via `beforeBuildCommand`
      # (`vue-tsc --noEmit && vite build`), so these deps are load-bearing.
      - name: Install frontend dependencies
        run: npm ci --no-audit --no-fund

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          # Stated explicitly per matrix row; on each runner the host triple
          # already matches, so this is a no-op that documents intent.
          targets: ${{ matrix.target }}

      - name: Cache Rust build
        uses: Swatinem/rust-cache@v2
        with:
          # The crate is NOT at the repository root. Left at its default (`.`)
          # the action finds no Cargo.toml and silently caches nothing, which
          # is the difference between a fast and a very slow release build.
          workspaces: src-tauri
          # Keep the cache even when the build fails, so a fixed re-run is fast.
          cache-on-failure: true

      # `cargo` (and therefore `tauri build`) fails with ResourcePathNotFound
      # when `externalBin` resolves to a file that is not there. Shared with
      # `ci.yml` via this composite action so the pinned version + digest live
      # in exactly one auditable place. `platform` selects the asset.
      - name: Fetch the mihomo sidecar
        uses: ./.github/actions/fetch-mihomo
        with:
          platform: ${{ matrix.sidecar }}

      # tauri-action takes the release body as a *string* and has no way to read
      # a file, so the changelog is loaded here and handed over as an output.
      # Must run before the publish step, which interpolates it.
      #
      # The heredoc form of `$GITHUB_OUTPUT` is required: the parser is
      # line-oriented, so a raw multi-line value would be truncated at the first
      # blank line. (Do NOT "solve" this by base64-ing the value — that would
      # render the Release body as base64 gibberish.)
      - name: Publish notes
        id: notes
        shell: bash
        run: |
          # The delimiter must not appear on its own line in the file; this one
          # is deliberately obscure for that reason.
          {
            echo 'notes_body<<FLEXCLASH_CHANGELOG_EOF'
            cat release_notes.md
            echo 'FLEXCLASH_CHANGELOG_EOF'
          } >> "$GITHUB_OUTPUT"

      - name: Build, bundle and publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri accepts either a path or the key *contents*; on CI it must be
          # the contents, which is what the secret holds. It must be the private
          # half of the keypair whose public half is `plugins.updater.pubkey`
          # in tauri.conf.json -- a mismatch builds fine and fails only at
          # update time, in users' installs.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_PRIVATE_KEY }}
          # MUST be present and empty. The key is scrypt-encrypted with an empty
          # password; if this variable is unset, tauri prompts on the terminal
          # and the job hangs until it is killed.
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ""
        with:
          # Attach the release to the tag that triggered the run.
          tagName: ${{ github.ref_name }}
          releaseName: "FlexClash ${{ github.ref_name }}"
          # `release_notes.md` is the SINGLE source of truth for the changelog.
          #
          # NOTE: tauri-action has NO `bodyPath` input -- only a `releaseBody`
          # *string*. Passing an unknown key silently produced an EMPTY release
          # body (observed on v0.6.4), so the file's contents are read into a
          # step output by the "Publish notes" step and interpolated here.
          releaseBody: ${{ steps.notes.outputs.notes_body }}
          # NOT a draft and NOT a prerelease, deliberately: the updater polls
          # `releases/latest/download/latest.json`, and `/latest/` excludes both.
          releaseDraft: false
          prerelease: false
          # Regenerate `latest.json` from the signed bundles so the in-app
          # updater keeps working. Each matrix row contributes its platform's
          # entry; tauri-action merges them into the same release manifest.
          includeUpdaterJson: true

      # ------------------------------------------------------------------------
      # `latest.json > notes` is EMPTY in the manifest tauri-action uploads.
      #
      # The action generates the updater manifest itself and has no notes input,
      # so the in-app update dialog renders a blank changelog even though the
      # Release page (fixed above) has the full text. v0.6.4 shipped exactly
      # that way. `scripts/gen-latest-json.py` DOES inject the notes, but it
      # needs locally built + signed bundles, which a matrix runner does not
      # have for every platform — so patch the uploaded asset instead.
      #
      # Runs on exactly ONE matrix row (`matrix.sidecar == 'windows'`): the
      # manifest is a single shared asset that every row merges into, so two
      # concurrent patches would race and one would clobber the other.
      #
      # Needs `contents: write`, which this workflow already grants.
      # ------------------------------------------------------------------------
      - name: Patch updater manifest notes
        if: matrix.sidecar == 'windows'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: |
          set -euo pipefail

          # The asset was uploaded by the previous step on this same row, but
          # the upload is a separate HTTP request and may not be visible to the
          # API immediately, so poll rather than assume.
          asset=""
          for _ in $(seq 1 12); do
            asset="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" \
              --jq '.assets[] | select(.name=="latest.json") | .id' || true)"
            if [ -n "$asset" ]; then break; fi
            sleep 5
          done
          if [ -z "$asset" ]; then
            echo "::error::latest.json asset not found on $TAG after 60s"
            exit 1
          fi

          curl -sSL -o manifest.json \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/latest.json"

          # Python lives in a script, not a heredoc: inside a YAML block scalar
          # a heredoc terminator has to survive a layer of indentation, and a
          # stray leading space turns it into ordinary shell text that hangs
          # the step waiting on stdin.
          #
          # The script exits 0 without writing when the notes are already
          # present, which is what makes a re-run (or a second matrix row
          # racing this one) harmless.
          patched="$(python3 scripts/patch-latest-json-notes.py manifest.json release_notes.md)"
          echo "$patched"
          case "$patched" in
            *"already present"*) echo "nothing to do"; exit 0 ;;
          esac

          # A release asset cannot be overwritten in place: delete, then
          # re-upload under the same name.
          gh api --method DELETE \
            "repos/${{ github.repository }}/releases/assets/$asset"
          release_id="$(gh api "repos/${{ github.repository }}/releases/tags/$TAG" --jq '.id')"

          # Upload goes to the `uploads.github.com` HOST with curl, not
          # `gh api repos/.../assets/$asset`: the upload endpoint is a
          # different API host, and gh refuses to cross hosts, so the "natural"
          # spelling returns 404 (verified on v0.6.4). curl is not subject to
          # that restriction.
          curl -sS -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Content-Type: application/octet-stream" \
            --data-binary "@manifest.json" \
            "https://uploads.github.com/repos/${{ github.repository }}/releases/$release_id/assets?name=latest.json" \
            -o upload.json
          # GitHub answers a rejected upload with a 200-shaped JSON error body,
          # so check the payload instead of trusting curl's exit status. Single
          # line on purpose: a multi-line `python3 -c "..."` inside a bash double
          # quote is a quoting accident waiting to happen.
          python3 -c 'import json,sys; d=json.load(open("upload.json")); sys.exit("::error::re-upload failed: "+json.dumps(d)) if "id" not in d else print(d["name"], "re-uploaded,", d["size"], "bytes")'

          # Read back exactly what a user updating right now would receive.
          curl -sSL -o verify.json \
            "https://github.com/${{ github.repository }}/releases/download/$TAG/latest.json"
          python3 scripts/verify-latest-json-notes.py verify.json
