# ============================================================================
# fetch-mihomo — download and verify the mihomo sidecar.
#
# WHY THIS IS REQUIRED BY *EVERY* JOB, NOT JUST THE RELEASE ONE
# ------------------------------------------------------------
# `tauri.conf.json` declares `bundle.externalBin: ["binaries/mihomo"]`, and
# tauri-build's build script resolves that to a literal file name,
# `src-tauri/binaries/mihomo-x86_64-pc-windows-msvc.exe`, during `cargo build`.
# It is not a glob, so a missing file is an *error*, not an empty match:
#
#     tauri_utils::resources::resource_from_path -> ResourcePathNotFound
#
# Consequently a bare checkout cannot even run `cargo clippy` or `cargo test` in
# `src-tauri/` -- the build script fails before any of our code is looked at.
# `src-tauri/binaries/*` is `.gitignore`d on purpose (CONTRIBUTING.md: FlexClash
# does not redistribute the binary), so this action supplies it.
#
# WHY THE PIN LIVES HERE
# ----------------------
# Version *and* digest are pinned in this one file deliberately. Duplicating a
# third-party binary's hash across two workflows is precisely how a CI job and a
# released build end up exercising different kernels. Bump them together.
# ============================================================================

name: Fetch the mihomo sidecar
description: >-
  Download the pinned mihomo release asset, place it at the target-triple path
  that `bundle.externalBin` resolves to, and fail if the digest does not match.

inputs:
  version:
    description: mihomo release tag.
    required: false
    default: v1.19.30
  asset:
    description: >-
      Release asset base name; the `.zip` is implied. The `-compatible` build is
      GOAMD64=v1 and is the one whose exe matches `sha256`. The plain
      `mihomo-windows-amd64-<version>` asset is a DIFFERENT binary
      (50,078,720 B vs 50,132,992 B) -- do not swap it in.
    required: false
    default: mihomo-windows-amd64-compatible
  sha256:
    description: Expected sha256 of the exe inside the archive.
    required: false
    default: 6ac25fcb26afe8e1bea24b6e6e80805bf884a33232d12e2d78dfa0b6c529ac14

runs:
  using: composite
  steps:
    - name: Download and verify
      shell: pwsh
      env:
        MIHOMO_VERSION: ${{ inputs.version }}
        MIHOMO_ASSET: ${{ inputs.asset }}
        MIHOMO_SHA256: ${{ inputs.sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        # The progress bar on a ~18MB download costs more than the download
        # itself and floods the log with carriage-return redraws.
        $ProgressPreference = 'SilentlyContinue'

        $zip  = "$env:MIHOMO_ASSET-$env:MIHOMO_VERSION.zip"
        $url  = "https://github.com/MetaCubeX/mihomo/releases/download/$env:MIHOMO_VERSION/$zip"
        $dest = 'src-tauri/binaries/mihomo-x86_64-pc-windows-msvc.exe'

        New-Item -ItemType Directory -Force -Path 'src-tauri/binaries' | Out-Null

        Write-Host "downloading $url"
        Invoke-WebRequest -Uri $url -OutFile 'mihomo.zip'

        $tmp = 'mihomo-extract'
        Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
        Expand-Archive -LiteralPath 'mihomo.zip' -DestinationPath $tmp -Force

        # The entry inside the archive is named after the asset
        # (`mihomo-windows-amd64-compatible.exe`), NOT plain `mihomo.exe`, and the
        # name differs per variant. Discover it rather than assume it.
        $inner = Get-ChildItem -Path $tmp -Filter '*.exe' | Select-Object -First 1
        if (-not $inner) { throw "no .exe inside $zip" }

        # The bundler only ever looks for the target-triple file name.
        Move-Item -LiteralPath $inner.FullName -Destination $dest -Force

        $size = (Get-Item -LiteralPath $dest).Length
        $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLower()
        Write-Host "sidecar: $dest ($size bytes)"
        Write-Host "sha256 : $hash"

        # This exe is baked into an installer users run as admin. A re-uploaded
        # or substituted asset must fail the run, not ship.
        if ($hash -ne $env:MIHOMO_SHA256) {
          throw "mihomo digest mismatch: expected $env:MIHOMO_SHA256, got $hash"
        }
        Write-Host 'sidecar digest verified'
