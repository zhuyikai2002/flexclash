[package]
name = "flexclash"
version = "0.2.4"
description = "FlexClash - lightweight Mihomo (Clash Meta) proxy client"
authors = ["FlexClash Contributors"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "flexclash_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-shell    = "2"
tauri-plugin-fs       = "2"
tauri-plugin-http     = "2"
tauri-plugin-process  = "2"
tauri-plugin-dialog   = "2"
tauri-plugin-autostart = "2"
tauri-plugin-clipboard-manager = "2"
window-vibrancy       = "0.5"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
thiserror = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros", "time", "fs", "sync"] }
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
uuid = { version = "1", features = ["v4"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "serde"] }
rusqlite = { version = "0.31", features = ["bundled"] }
tauri-specta = { version = "=2.0.0-rc.25", features = ["javascript", "typescript"] }
specta = { version = "=2.0.0-rc.25", features = ["derive", "serde_json"] }
specta-typescript = "0.0.12"
tauri-plugin-updater = "2.0.0-rc.4"

[dev-dependencies]
serial_test = "3"

# Windows-only: registry + WinINET refresh
[target."cfg(windows)".dependencies]
winreg = "0.52"
windows = { version = "0.58", features = [
  "Win32_Foundation",
  "Win32_Networking_WinInet",
  "Win32_Security",
  "Win32_System_JobObjects",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
  "Win32_UI_Input_KeyboardAndMouse",
] }
# WebView2 底层控制：彻底禁用 DevTools + 浏览器加速键（Ctrl+Shift+I / F12 / Ctrl+R 等）
webview2-com = "0.38"
windows-core = "0.61"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
