# ============================================================================
# fetch-mihomo — download and verify the mihomo sidecar for a target platform.
#
# WHY THIS IS REQUIRED BY *EVERY* JOB, NOT JUST THE RELEASE ONE
# ------------------------------------------------------------
# `tauri.conf.json` declares `bundle.externalBin: ["binaries/mihomo"]`, and
# tauri-build's build script resolves that to a literal file name during
# `cargo build` (`src-tauri/binaries/mihomo-x86_64-pc-windows-msvc.exe` on
# Windows, `...-unknown-linux-gnu` on Linux). It is not a glob, so a missing
# file is an *error*, not an empty match:
#
#     tauri_utils::resources::resource_from_path -> ResourcePathNotFound
#
# Consequently a bare checkout cannot even run `cargo clippy` or `cargo test` in
# `src-tauri/` -- the build script fails before any of our code is looked at.
# `src-tauri/binaries/*` is `.gitignore`d on purpose (CONTRIBUTING.md: FlexClash
# does not redistribute the binary), so this action supplies it.
#
# WHY THE PIN LIVES HERE
# ----------------------
# Version *and* digest are pinned in this one file deliberately. Duplicating a
# third-party binary's hash across two workflows is precisely how a CI job and a
# released build end up exercising different kernels. Bump them together.
#
# PLATFORMS
# ---------
# `platform` defaults to `windows` so the existing `ci.yml` call site keeps
# working untouched; `release.yml` passes `linux` for the Ubuntu matrix row.
# ============================================================================

name: Fetch the mihomo sidecar
description: >-
  Download the pinned mihomo release asset for the requested platform, place it
  at the target-triple path that `bundle.externalBin` resolves to, and fail if
  the digest does not match.

inputs:
  platform:
    description: '"windows" (default, used by ci.yml) or "linux".'
    required: false
    default: windows
  version:
    description: mihomo release tag.
    required: false
    default: v1.19.31
  # --- Windows ---------------------------------------------------------------
  asset:
    description: >-
      Windows release asset base name; the `.zip` is implied. The `-compatible`
      build is GOAMD64=v1 and is the one whose exe matches `sha256`. The plain
      `mihomo-windows-amd64-<version>` asset is a DIFFERENT binary -- do not
      swap it in.
    required: false
    default: mihomo-windows-amd64-compatible
  sha256:
    description: Expected sha256 of the exe inside the Windows archive.
    required: false
    default: 1fa8055e03596fc35167f70e9ecd1890517d38d960a39177445746a1b0defc2b
  # --- Linux -----------------------------------------------------------------
  asset_linux:
    description: Linux release asset base name; the `.gz` is implied.
    required: false
    default: mihomo-linux-amd64
  sha256_linux:
    description: Expected sha256 of the *decompressed* Linux binary.
    required: false
    default: 08787faafea19c1ab0f83fa5a1b22363b7d03ea78da18091a4c883aecaaa5979

runs:
  using: composite
  steps:
    - name: Download and verify (Windows)
      if: inputs.platform == 'windows'
      shell: pwsh
      env:
        MIHOMO_VERSION: ${{ inputs.version }}
        MIHOMO_ASSET: ${{ inputs.asset }}
        MIHOMO_SHA256: ${{ inputs.sha256 }}
      run: |
        $ErrorActionPreference = 'Stop'
        # The progress bar on a ~22MB download costs more than the download
        # itself and floods the log with carriage-return redraws.
        $ProgressPreference = 'SilentlyContinue'

        $zip  = "$env:MIHOMO_ASSET-$env:MIHOMO_VERSION.zip"
        $url  = "https://github.com/MetaCubeX/mihomo/releases/download/$env:MIHOMO_VERSION/$zip"
        $dest = 'src-tauri/binaries/mihomo-x86_64-pc-windows-msvc.exe'

        New-Item -ItemType Directory -Force -Path 'src-tauri/binaries' | Out-Null

        Write-Host "downloading $url"
        Invoke-WebRequest -Uri $url -OutFile 'mihomo.zip'

        $tmp = 'mihomo-extract'
        Remove-Item -Recurse -Force $tmp -ErrorAction SilentlyContinue
        Expand-Archive -LiteralPath 'mihomo.zip' -DestinationPath $tmp -Force

        # The entry inside the archive is named after the asset
        # (`mihomo-windows-amd64-compatible.exe`), NOT plain `mihomo.exe`, and the
        # name differs per variant. Discover it rather than assume it.
        $inner = Get-ChildItem -Path $tmp -Filter '*.exe' | Select-Object -First 1
        if (-not $inner) { throw "no .exe inside $zip" }

        # The bundler only ever looks for the target-triple file name.
        Move-Item -LiteralPath $inner.FullName -Destination $dest -Force

        $size = (Get-Item -LiteralPath $dest).Length
        $hash = (Get-FileHash -Algorithm SHA256 -LiteralPath $dest).Hash.ToLower()
        Write-Host "sidecar: $dest ($size bytes)"
        Write-Host "sha256 : $hash"

        # This exe is baked into an installer users run as admin. A re-uploaded
        # or substituted asset must fail the run, not ship.
        if ($hash -ne $env:MIHOMO_SHA256) {
          throw "mihomo digest mismatch: expected $env:MIHOMO_SHA256, got $hash"
        }
        Write-Host 'sidecar digest verified'

    - name: Download and verify (Linux)
      if: inputs.platform == 'linux'
      shell: bash
      env:
        MIHOMO_VERSION: ${{ inputs.version }}
        MIHOMO_ASSET: ${{ inputs.asset_linux }}
        MIHOMO_SHA256: ${{ inputs.sha256_linux }}
      run: |
        set -euo pipefail

        gz="${MIHOMO_ASSET}-${MIHOMO_VERSION}.gz"
        url="https://github.com/MetaCubeX/mihomo/releases/download/${MIHOMO_VERSION}/${gz}"
        dest="src-tauri/binaries/mihomo-x86_64-unknown-linux-gnu"

        mkdir -p src-tauri/binaries

        echo "downloading $url"
        # --retry covers the transient 5xx / connection resets that a cold CDN
        # edge occasionally returns. The asset is ~22MB.
        curl -fL --retry 3 --retry-delay 2 -o mihomo.gz "$url"

        # The release ships a gzipped bare binary (no archive wrapper).
        gunzip -c mihomo.gz > "$dest"
        chmod +x "$dest"

        size=$(stat -c%s "$dest")
        hash=$(sha256sum "$dest" | awk '{print $1}')
        echo "sidecar: $dest ($size bytes)"
        echo "sha256 : $hash"

        # Verify the *decompressed* bytes: gzip mtime/OS header bytes are not
        # stable, so the tarball's own digest would be a poor pin.
        if [ "$hash" != "$MIHOMO_SHA256" ]; then
          echo "::error::mihomo digest mismatch: expected $MIHOMO_SHA256, got $hash"
          exit 1
        fi
        echo "sidecar digest verified"